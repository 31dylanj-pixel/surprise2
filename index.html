<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Untitled</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="scene">

        <div class="sky"></div>

        <div class="moon">
            <div class="moon-crater crater-1"></div>
            <div class="moon-crater crater-2"></div>
            <div class="moon-crater crater-3"></div>
            <div class="moon-crater crater-4"></div>
        </div>

        <div class="stars" id="stars"></div>

        <div class="mountains back"></div>
        <div class="mountains front"></div>

        <div class="content">
            <div class="label">SOMEWHERE</div>
            <h1 id="clock">00:00</h1>
            <p id="date"></p>
        </div>

        <div class="quote" id="quote"></div>

        <button id="change">✦</button>

    </div>

    <script src="script.js"></script>
</body>
</html>
